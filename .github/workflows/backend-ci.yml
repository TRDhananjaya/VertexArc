name: VertexArc Backend CI

# Run checks whenever code is pushed or a pull request is opened
on:
  push:
  pull_request:

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      # Download the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the Node.js runtime
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Install exact dependency versions from package-lock.json
      - name: Install dependencies
        run: npm ci

      # Provide a test-only JWT secret without committing .env.test
      - name: Create test environment
        run: echo "JWT_SECRET=$JWT_SECRET" > .env.test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET_TEST }}

      # Run the complete Jest test suite
      - name: Run automated tests
        run: npm test

      # Check dependencies for known high and critical vulnerabilities
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high

      # Check production dependencies with a stricter severity threshold
      - name: Production dependency security scan
        run: npm audit --omit=dev --audit-level=moderate
